name = "steven-portfolio"
main = "worker/index.js"
compatibility_date = "2024-09-23"

# The built site (npm run build) is served as static assets
[assets]
directory = "./dist"
binding = "ASSETS"

# Workers AI binding used by functions/api/chat.js
[ai]
binding = "AI"

# Per-visitor limit for Robo's AI chat: at most 6 questions per minute per IP.
# Approximate (counted per Cloudflare location). Needs Wrangler 4.36 or newer.
[[ratelimits]]
name = "CHAT_LIMITER"
namespace_id = "1001"

  [ratelimits.simple]
  limit = 6
  period = 60

# Per-visitor limit for the hire form: at most 3 messages per minute per IP
[[ratelimits]]
name = "CONTACT_LIMITER"
namespace_id = "1002"

  [ratelimits.simple]
  limit = 3
  period = 60

# Hire form emails (functions/api/contact.js). Free via Cloudflare Email Routing:
# enable Email Routing for sldev.my.id and verify this address once in the dashboard.
[[send_email]]
name = "SEND_EMAIL"
destination_address = "achensteven2005@gmail.com"
