    <!-- Intro screen: inline so it paints instantly, before the app's JavaScript loads -->
    <style>
      #intro{position:fixed;inset:0;z-index:9999;display:grid;place-items:center;background:#111;color:#F4F4F0;font-family:"JetBrains Mono",ui-monospace,Menlo,Consolas,monospace;clip-path:inset(0 0 0 0);transition:clip-path .85s cubic-bezier(.76,0,.24,1)}
      #intro.out{clip-path:inset(0 0 100% 0)}
      html.intro-lock,html.intro-lock body{overflow:hidden}
      #intro .ib{display:flex;flex-direction:column;align-items:center;gap:22px;width:min(330px,82vw);transition:transform .85s cubic-bezier(.76,0,.24,1),opacity .4s}
      #intro.out .ib{transform:translateY(-60px);opacity:0}
      #intro svg{width:104px;height:104px;overflow:visible}
      #intro .ring{fill:none;stroke:#F4F4F0;stroke-width:3;stroke-linecap:round;stroke-dasharray:302;stroke-dashoffset:302;transform:rotate(-90deg);transform-origin:52px 52px;animation:iDraw 1s .1s cubic-bezier(.6,0,.2,1) forwards}
      #intro .mono{font:700 30px "JetBrains Mono",ui-monospace,Menlo,monospace;fill:#F4F4F0;opacity:0;animation:iFade .4s .55s forwards}
      #intro .dot{fill:#2563EB;opacity:0;animation:iFade .3s .9s forwards}
      #intro .log{align-self:stretch;margin:0;padding:0;list-style:none;font-size:13px;line-height:1.95;color:#9C9C95}
      #intro .log li{opacity:0;transform:translateY(4px);animation:iLine .3s forwards}
      #intro .log li:nth-child(1){animation-delay:.35s}
      #intro .log li:nth-child(2){animation-delay:.7s}
      #intro .log li:nth-child(3){animation-delay:1.05s}
      #intro .log li:nth-child(4){animation-delay:1.35s}
      #intro .log b{color:#F4F4F0;font-weight:500}
      #intro .ok{color:#4ADE80}
      #intro .cur{display:inline-block;width:.6em;height:1em;vertical-align:-.15em;background:#F4F4F0;animation:iBlink 1s steps(1) infinite}
      #intro .bar{align-self:stretch;height:3px;border-radius:3px;background:#2A2A28;overflow:hidden}
      #intro .bar i{display:block;height:100%;width:100%;transform:scaleX(0);transform-origin:left;background:#2563EB;animation:iBar 1.45s .1s cubic-bezier(.4,0,.2,1) forwards}
      #intro .meta{align-self:stretch;display:flex;justify-content:space-between;font-size:11px;letter-spacing:.1em;text-transform:uppercase;color:#77776F}
      @keyframes iDraw{to{stroke-dashoffset:0}}
      @keyframes iFade{to{opacity:1}}
      @keyframes iLine{to{opacity:1;transform:none}}
      @keyframes iBlink{50%{opacity:0}}
      @keyframes iBar{to{transform:scaleX(1)}}
    </style>
  </head>
  <body>
    <div id="intro" aria-hidden="true">
      <div class="ib">
        <svg viewBox="0 0 104 104">
          <circle class="ring" cx="52" cy="52" r="48" />
          <text class="mono" x="52" y="62" text-anchor="middle">SL</text>
          <circle class="dot" cx="86" cy="86" r="6" />
        </svg>
        <ul class="log">
          <li><b>steven@sldev</b>:~$ boot portfolio</li>
          <li><span class="ok">✓</span> loading projects and certifications</li>
          <li><span class="ok">✓</span> waking up Xiao Hei</li>
          <li><span class="ok">✓</span> ready <span class="cur"></span></li>
        </ul>
        <div class="bar"><i></i></div>
        <div class="meta"><span>Steven Lim</span><span id="intro-pct">0%</span></div>
      </div>
    </div>
    <script>
      // Show the intro once per visit; skip it for repeat page loads and reduced-motion users.
      // The app calls window.__introDone() when it has rendered; a timeout hides it regardless.
      (function () {
        var el = document.getElementById('intro');
        var seen = false;
        try {
          seen = sessionStorage.getItem('intro-seen') === '1';
          sessionStorage.setItem('intro-seen', '1');
        } catch (e) {}
        var reduce = window.matchMedia && matchMedia('(prefers-reduced-motion: reduce)').matches;
        if (seen || reduce) {
          el.parentNode.removeChild(el);
          window.__introDone = function () {};
          return;
        }
        var root = document.documentElement;
        root.classList.add('intro-lock');
        var t0 = performance.now();
        var MIN = 1650;
        var pct = document.getElementById('intro-pct');
        (function tick() {
          var p = Math.min(100, Math.round(((performance.now() - t0) / 1550) * 100));
          pct.textContent = p + '%';
          if (p < 100 && el.isConnected) requestAnimationFrame(tick);
        })();
        var done = false;
        window.__introDone = function () {
          if (done) return;
          done = true;
          setTimeout(function () {
            el.classList.add('out');
            root.classList.remove('intro-lock');
            setTimeout(function () { el.parentNode && el.parentNode.removeChild(el); }, 950);
          }, Math.max(0, MIN - (performance.now() - t0)));
        };
        setTimeout(window.__introDone, 4500);
      })();
    </script>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
