    <!-- Intro screen: inline so it paints instantly, before the app's JavaScript loads -->
    <style>
      #intro{position:fixed;inset:0;z-index:9999;color:#F4F4F0;font-family:"JetBrains Mono",ui-monospace,Menlo,Consolas,monospace;overflow:hidden}
      html.intro-lock,html.intro-lock body{overflow:hidden}
      #intro .cols{position:absolute;inset:0;display:flex}
      #intro .col{flex:1;background:#0E0E0D;border-right:1px solid rgba(255,255,255,.06);transition:transform .8s cubic-bezier(.76,0,.24,1)}
      #intro .col:last-child{border-right:0}
      #intro.out .col{transform:translateY(-101%)}
      #intro.out .col:nth-child(2){transition-delay:.06s}
      #intro.out .col:nth-child(3){transition-delay:.12s}
      #intro.out .col:nth-child(4){transition-delay:.18s}
      #intro.out .col:nth-child(5){transition-delay:.24s}
      #intro .scan{position:absolute;left:0;right:0;top:-14%;height:14%;background:linear-gradient(transparent,rgba(79,125,243,.13),transparent);animation:iScan 1.7s .15s cubic-bezier(.5,0,.5,1) both;pointer-events:none}
      #intro .ui{position:absolute;inset:0;display:flex;flex-direction:column;justify-content:space-between;gap:24px;padding:max(22px,env(safe-area-inset-top,0px)) max(22px,env(safe-area-inset-right,0px)) max(22px,env(safe-area-inset-bottom,0px)) max(22px,env(safe-area-inset-left,0px));transition:opacity .35s,transform .55s cubic-bezier(.76,0,.24,1)}
      #intro.out .ui{opacity:0;transform:translateY(-28px)}
      #intro .top{display:flex;justify-content:space-between;gap:12px;font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:#8C8C85;animation:iFade .5s .1s both}
      #intro .top b{color:#F4F4F0;font-weight:500}
      #intro .mid{display:flex;flex-direction:column;align-items:center;gap:20px;text-align:center}
      #intro .bot{width:116px;height:116px;overflow:visible;animation:iPop .6s cubic-bezier(.3,1.5,.5,1) both}
      #intro .bot .power{opacity:0;animation:iPower .5s .45s steps(1) both}
      #intro .bot .look{animation:iLook 1.1s .85s ease-in-out both}
      #intro .bot .eye{transform-box:fill-box;transform-origin:center;animation:iBlink .22s 1.45s both}
      #intro .bot .tip{animation:iTip .8s .2s steps(1) infinite}
      #intro .name{margin:0;font:700 clamp(42px,12vw,104px)/1 "Space Grotesk",system-ui,-apple-system,sans-serif;letter-spacing:-.035em;white-space:nowrap}
      #intro .name .dot{color:#2563EB}
      #intro .role{margin:0;font-size:13px;color:#A9A9A2;min-height:1.5em}
      #intro .role i{display:inline-block;width:.55em;height:1.05em;vertical-align:-.18em;background:#F4F4F0;margin-left:2px;animation:iCur 1s steps(1) infinite}
      #intro .foot{display:flex;flex-direction:column;gap:14px}
      #intro .row{display:flex;justify-content:space-between;align-items:flex-end;gap:16px}
      #intro .status{margin:0;font-size:12.5px;color:#A9A9A2;min-height:1.5em}
      #intro .status b{color:#7EE2A8;font-weight:500}
      #intro .pct{font:700 clamp(54px,15vw,128px)/.78 "Space Grotesk",system-ui,-apple-system,sans-serif;letter-spacing:-.05em;font-variant-numeric:tabular-nums}
      #intro .pct small{font-size:.35em;letter-spacing:0;color:#8C8C85;margin-left:4px}
      #intro .bar{height:2px;background:#2A2A28;overflow:hidden}
      #intro .bar i{display:block;height:100%;transform-origin:left;transform:scaleX(var(--p,0));background:#2563EB}
      @keyframes iFade{from{opacity:0}}
      @keyframes iScan{to{top:100%}}
      @keyframes iPop{from{opacity:0;transform:scale(.6) translateY(12px)}}
      @keyframes iPower{0%{opacity:1}20%{opacity:.15}40%{opacity:1}55%{opacity:.3}70%,100%{opacity:1}}
      @keyframes iLook{0%,100%{transform:none}30%{transform:translateX(-6px)}65%{transform:translateX(6px)}}
      @keyframes iBlink{50%{transform:scaleY(.1)}}
      @keyframes iTip{50%{opacity:.25}}
      @keyframes iCur{50%{opacity:0}}
    </style>

  <body>
    <div id="intro" aria-hidden="true">
      <div class="cols"><i class="col"></i><i class="col"></i><i class="col"></i><i class="col"></i><i class="col"></i></div>
      <div class="scan"></div>
      <div class="ui">
        <div class="top"><span><b>SL</b> · sldev.my.id</span><span>Portfolio · 2026</span></div>
        <div class="mid">
          <svg class="bot" viewBox="0 0 120 120">
            <defs>
              <filter id="iglow" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="3" result="b" /><feMerge><feMergeNode in="b" /><feMergeNode in="SourceGraphic" /></feMerge></filter>
            </defs>
            <line x1="60" y1="8" x2="60" y2="26" stroke="#5A5A55" stroke-width="4" stroke-linecap="round" />
            <circle class="tip" cx="60" cy="8" r="6" fill="#2563EB" />
            <rect x="0" y="50" width="12" height="26" rx="6" fill="#3A3A36" />
            <rect x="108" y="50" width="12" height="26" rx="6" fill="#3A3A36" />
            <rect x="8" y="26" width="104" height="76" rx="36" fill="#F4F4F0" />
            <rect x="20" y="40" width="80" height="48" rx="24" fill="#0E0E0D" />
            <g class="power" filter="url(#iglow)">
              <g class="look">
                <ellipse class="eye" cx="45" cy="64" rx="7.5" ry="10" fill="#8FD8FF" />
                <ellipse class="eye" cx="75" cy="64" rx="7.5" ry="10" fill="#8FD8FF" />
              </g>
            </g>
          </svg>
          <p class="name"><span id="intro-name">STEVEN LIM</span><span class="dot">.</span></p>
          <p class="role"><span id="intro-role"></span><i></i></p>
        </div>
        <div class="foot">
          <div class="row">
            <p class="status" id="intro-status"><b>$</b> boot portfolio</p>
            <div class="pct"><span id="intro-pct">0</span><small>%</small></div>
          </div>
          <div class="bar"><i id="intro-bar"></i></div>
        </div>
      </div>
    </div>
    <script>
      // Show the intro once per visit; skip it for repeat page loads and reduced-motion users.
      // The app calls window.__introDone() when it has rendered; a timeout hides it regardless.
      (function () {
        var el = document.getElementById('intro');
        var seen = false;
        try {
          seen = sessionStorage.getItem('intro-seen') === '1';
          sessionStorage.setItem('intro-seen', '1');
        } catch (e) {}
        var reduce = window.matchMedia && matchMedia('(prefers-reduced-motion: reduce)').matches;
        if (seen || reduce) {
          el.parentNode.removeChild(el);
          window.__introDone = function () {};
          return;
        }
        var root = document.documentElement;
        root.classList.add('intro-lock');
        var t0 = performance.now();
        var MIN = 2000;
        var LOAD = 1750;

        // Name decodes from random characters
        var nameEl = document.getElementById('intro-name');
        var NAME = 'STEVEN LIM';
        var GLYPHS = 'ABCDEFGHIJKLMNOPQRSTUVWXYZ0123456789#%&/<>';
        // Role types itself
        var roleEl = document.getElementById('intro-role');
        var ROLE = 'Full-stack developer · Pekanbaru, Indonesia';
        // Status line steps through the boot
        var statusEl = document.getElementById('intro-status');
        var STEPS = [
          [0, '<b>$</b> boot portfolio'],
          [420, '<b>✓</b> loading projects'],
          [820, '<b>✓</b> loading certifications'],
          [1220, '<b>✓</b> waking up Robo'],
          [1620, '<b>✓</b> ready']
        ];
        var pctEl = document.getElementById('intro-pct');
        var barEl = document.getElementById('intro-bar');
        var step = -1;

        (function frame() {
          var t = performance.now() - t0;
          // decode: each letter settles between 300ms and 1100ms
          var out = '';
          for (var i = 0; i < NAME.length; i++) {
            var settle = 300 + i * 80;
            var c = NAME.charAt(i);
            out += c === ' ' || t > settle ? c : t < 150 ? '\u00a0' : GLYPHS.charAt(Math.floor(Math.random() * GLYPHS.length));
          }
          nameEl.textContent = out;
          // typing
          var n = Math.max(0, Math.min(ROLE.length, Math.floor((t - 700) / 22)));
          roleEl.textContent = ROLE.slice(0, n);
          // status
          while (step + 1 < STEPS.length && t >= STEPS[step + 1][0]) {
            step++;
            statusEl.innerHTML = STEPS[step][1];
          }
          // progress with an ease-out curve
          var p = Math.min(1, t / LOAD);
          p = 1 - Math.pow(1 - p, 2.2);
          pctEl.textContent = Math.round(p * 100);
          barEl.style.setProperty('--p', p.toFixed(3));
          if (el.isConnected && !el.classList.contains('out')) requestAnimationFrame(frame);
        })();

        var done = false;
        window.__introDone = function () {
          if (done) return;
          done = true;
          setTimeout(function () {
            pctEl.textContent = '100';
            barEl.style.setProperty('--p', '1');
            nameEl.textContent = NAME;
            roleEl.textContent = ROLE;
            el.classList.add('out');
            root.classList.remove('intro-lock');
            setTimeout(function () { el.parentNode && el.parentNode.removeChild(el); }, 1150);
          }, Math.max(0, MIN - (performance.now() - t0)));
        };
        setTimeout(window.__introDone, 4500);
      })();
    </script>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
